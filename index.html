<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>m00n-phases</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="drag-region">
    <div id="bg"></div>
    <canvas id="sparkle-canvas"></canvas>
    <div id="screen-title"></div>
    <div id="week-screen"></div>

    <button id="weeklymoons-btn" class="no-drag-region"></button>
    <button id="minimize-btn" class="no-drag-region"></button>
    <button id="exit-btn" class="no-drag-region"></button>

    <div id="moon"></div>
    <div id="moon-text">
        <p id="moon-name"></p>
        <p id="moon-date"></p>
        <p id="moon-desc"></p>
    </div>

    <p id="day-message">No moon available, come back later !</p>

    <script src="renderer.js"></script>
</body>

</html>
